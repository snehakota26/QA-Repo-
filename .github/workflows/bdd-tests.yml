name: BDD Tests (Cucumber)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bdd:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # Non-@integration scenarios only - no live Azure/MCP dependencies required
      - name: Run BDD scenarios
        run: |
          mkdir -p reports
          npx cucumber-js specs --require specs/support --require specs/steps --tags "not @integration" --format json:reports/cucumber-report.json
      - name: Generate HTML report
        if: ${{ !cancelled() }}
        run: node scripts/generate-report.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-bdd-report
          path: reports/
          retention-days: 30
